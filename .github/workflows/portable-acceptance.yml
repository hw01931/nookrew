name: Portable acceptance
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Exact draft or published release ID
        required: true
      version:
        description: Exact candidate version
        required: true
      verify_bootstrap:
        description: Verify public download bootstrap after publication
        default: 'false'
permissions:
  contents: read
jobs:
  packaged-runtime:
    # Temporary candidate validation only: draft assets require a push-capable token.
    # Remove this job override before updating the default installation branch.
    permissions:
      contents: write
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: win32-x64
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch exact candidate and verify pinned SHA256
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ inputs.version }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          mkdir candidate
          ASSET="Nookrew-${VERSION}-${TARGET}.tar.gz"
          ID=$(gh api "repos/hw01931/nookrew/releases/${RELEASE_ID}/assets" --jq ".[] | select(.name == \"${ASSET}\") | .id")
          test -n "$ID"
          gh api -H 'Accept: application/octet-stream' "repos/hw01931/nookrew/releases/assets/${ID}" > "candidate/${ASSET}"
          node scripts/verify-candidate-archive.cjs "candidate/${ASSET}" "$TARGET"
          tar -xzf "candidate/${ASSET}" -C candidate
      - name: Verify packaged office without model calls
        shell: bash
        run: node scripts/verify-office-portable.cjs candidate/nookrew
      - name: Verify Git install bootstrap and cached reopen
        if: inputs.verify_bootstrap == 'true'
        shell: bash
        run: node scripts/verify-office-bootstrap.cjs plugins/nookrew
