{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "title": "AIOrchestra Task Contract v0.1",
  "description": "Worker-public contract only. Evaluator secrets and gold patches must be stored separately.",
  "type": "object",
  "additionalProperties": false,
  "required": [
    "schema_version",
    "task_id",
    "revision",
    "repository",
    "goal",
    "delivery",
    "constraints",
    "allowed_scope",
    "forbidden_scope",
    "references",
    "acceptance_criteria",
    "verification",
    "risk",
    "limits",
    "tags"
  ],
  "properties": {
    "schema_version": {
      "const": "0.1"
    },
    "task_id": {
      "type": "string",
      "pattern": "^T[0-9]{3,}$"
    },
    "revision": {
      "type": "integer",
      "minimum": 1
    },
    "repository": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "reference",
        "base_snapshot"
      ],
      "properties": {
        "reference": {
          "type": "string",
          "minLength": 1
        },
        "base_snapshot": {
          "type": "string",
          "minLength": 1
        }
      }
    },
    "goal": {
      "type": "string",
      "minLength": 1
    },
    "delivery": {
      "enum": [
        "patch",
        "apply"
      ]
    },
    "constraints": {
      "type": "array",
      "minItems": 1,
      "uniqueItems": true,
      "items": {
        "type": "string",
        "minLength": 1
      }
    },
    "allowed_scope": {
      "type": "array",
      "minItems": 1,
      "uniqueItems": true,
      "items": {
        "type": "string",
        "minLength": 1
      }
    },
    "forbidden_scope": {
      "type": "array",
      "uniqueItems": true,
      "items": {
        "type": "string",
        "minLength": 1
      }
    },
    "references": {
      "type": "array",
      "uniqueItems": true,
      "items": {
        "type": "string",
        "minLength": 1
      }
    },
    "acceptance_criteria": {
      "type": "array",
      "minItems": 1,
      "uniqueItems": true,
      "items": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "description"
        ],
        "properties": {
          "id": {
            "type": "string",
            "minLength": 1
          },
          "description": {
            "type": "string",
            "minLength": 1
          }
        }
      }
    },
    "verification": {
      "type": "array",
      "minItems": 1,
      "uniqueItems": true,
      "items": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "check_id",
          "required",
          "criterion_ids",
          "kind",
          "timeout_seconds"
        ],
        "properties": {
          "check_id": {
            "type": "string",
            "minLength": 1
          },
          "required": {
            "type": "boolean"
          },
          "criterion_ids": {
            "type": "array",
            "minItems": 1,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "minLength": 1
            }
          },
          "kind": {
            "enum": [
              "test",
              "typecheck",
              "build",
              "scope",
              "contract",
              "e2e",
              "human_review"
            ]
          },
          "timeout_seconds": {
            "type": "integer",
            "minimum": 1
          }
        }
      }
    },
    "risk": {
      "enum": [
        "low",
        "medium",
        "high"
      ]
    },
    "limits": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "max_attempts",
        "wall_time_seconds",
        "max_tool_calls",
        "max_context_tokens"
      ],
      "properties": {
        "max_attempts": {
          "type": "integer",
          "minimum": 1,
          "maximum": 10
        },
        "wall_time_seconds": {
          "type": "integer",
          "minimum": 1
        },
        "max_tool_calls": {
          "type": "integer",
          "minimum": 1
        },
        "max_context_tokens": {
          "type": "integer",
          "minimum": 1
        }
      }
    },
    "tags": {
      "type": "array",
      "minItems": 1,
      "uniqueItems": true,
      "items": {
        "type": "string",
        "minLength": 1
      }
    }
  }
}
